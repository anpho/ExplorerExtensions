name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    # Pin the image: windows-latest now points to the VS 2026 image, where the
    # v143 toolset is installed for compatibility without ATL headers, so
    # <atlbase.h> cannot be found. windows-2022 has VS 2022 (v143) with ATL.
    runs-on: windows-2022
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+)(\.\d+){0,3}(-[0-9A-Za-z.]+)?$') {
            throw "Invalid release tag '$tag'. Expected vMAJOR[.MINOR[.PATCH[.BUILD]]][-PRERELEASE]."
          }
          $core, $prerelease = $tag.Substring(1) -split '-', 2
          if ($core -notmatch '^\d+(\.\d+){0,3}$') {
            throw "Invalid numeric version '$core' in release tag '$tag'."
          }
          $parts = @($core -split '\.')
          while ($parts.Count -lt 4) {
            $parts += '0'
          }
          $ver4 = $parts -join '.'
          $isPrerelease = if ($prerelease) { 'true' } else { 'false' }
          "ver4=$ver4" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release version: $ver4 (prerelease=$isPrerelease)"

      - name: Ensure tag is on master
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/remotes/origin/master
          if ($LASTEXITCODE -eq 0) {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/master
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag commit $env:GITHUB_SHA is not an ancestor of origin/master; releases must be tagged from master."
            }
          } else {
            git show-ref --verify --quiet refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) {
              throw 'Neither origin/master nor origin/main is available; cannot verify the release commit.'
            }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag commit $env:GITHUB_SHA is not an ancestor of origin/main; releases must be tagged from master."
            }
          }

      - name: Write version.h
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.ver4 }}
        run: |
          $parts = $env:VERSION -split '\.'
          if ($parts.Count -ne 4) {
            throw "Expected a four-part version, got '$env:VERSION'."
          }
          $lines = @(
            '// Generated by CI from the release tag; do not edit manually.'
            '#pragma once'
            ''
            "#define APP_VER_MAJOR $($parts[0])"
            "#define APP_VER_MINOR $($parts[1])"
            "#define APP_VER_PATCH $($parts[2])"
            "#define APP_VER_BUILD $($parts[3])"
            ''
            '// Four-part version string used in VERSIONINFO resources.'
            ('#define APP_VER_STRING "' + $env:VERSION + '"')
          )
          Set-Content -Path 'src\version.h' -Value $lines -Encoding utf8NoBOM

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build x86
        shell: pwsh
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x86 ./src
          if ($LASTEXITCODE -ne 0) {
            throw "x86 build failed with exit code $LASTEXITCODE."
          }

      - name: Build x64
        shell: pwsh
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 ./src
          if ($LASTEXITCODE -ne 0) {
            throw "x64 build failed with exit code $LASTEXITCODE."
          }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            'src/build/ExplorerEnhancement_x86.dll'
            'src/build/ExplorerEnhancement_x64.dll'
            'src/build/ExplorerEnhancementManager_x86.exe'
            'src/build/ExplorerEnhancementManager_x64.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected build output is missing: $file"
            }
          }

      - name: Sign binaries
        shell: pwsh
        env:
          PFX_CERTIFICATE: ${{ secrets.PFX_CERTIFICATE }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_CERTIFICATE) {
            throw 'Repository secret PFX_CERTIFICATE is not set.'
          }
          if (-not $env:PFX_PASSWORD) {
            throw 'Repository secret PFX_PASSWORD is not set.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_CERTIFICATE))

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe was not found under the Windows SDK directory.'
          }
          $signtoolExe = $signtool.FullName

          $files = @(
            'src/build/ExplorerEnhancement_x86.dll'
            'src/build/ExplorerEnhancement_x64.dll'
            'src/build/ExplorerEnhancementManager_x86.exe'
            'src/build/ExplorerEnhancementManager_x64.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Cannot sign missing file: $file"
            }
            & $signtoolExe sign /f $pfxPath /p $env:PFX_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $file
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $file (exit code $LASTEXITCODE)."
            }
          }
          foreach ($file in $files) {
            & $signtoolExe verify /pa /q $file
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $file (exit code $LASTEXITCODE)."
            }
          }

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.ver4 }}
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source } else { $makensis = $null }
          }
          if (-not $makensis) {
            throw 'makensis.exe not found: NSIS is missing from the runner image.'
          }
          & $makensis "/DVERSION=$env:VERSION" Installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

      - name: Sign installer
        shell: pwsh
        env:
          PFX_CERTIFICATE: ${{ secrets.PFX_CERTIFICATE }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_CERTIFICATE -or -not $env:PFX_PASSWORD) {
            throw 'Repository secrets PFX_CERTIFICATE and PFX_PASSWORD must be set.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (-not (Test-Path -LiteralPath $pfxPath)) {
            throw "Signing certificate not found at $pfxPath; the binary signing step must run first."
          }
          $installerPath = 'ExplorerExtensionSetup.exe'
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not built: $installerPath is missing."
          }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe was not found under the Windows SDK directory.'
          }
          $signtoolExe = $signtool.FullName
          & $signtoolExe sign /f $pfxPath /p $env:PFX_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Signing failed for $installerPath (exit code $LASTEXITCODE)."
          }
          & $signtoolExe verify /pa /q $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Signature verification failed for $installerPath (exit code $LASTEXITCODE)."
          }

      - name: Create zip archives
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.ver4 }}
        run: |
          $archFiles = @{
            x86 = @('ExplorerEnhancement_x86.dll', 'ExplorerEnhancementManager_x86.exe')
            x64 = @('ExplorerEnhancement_x64.dll', 'ExplorerEnhancementManager_x64.exe')
          }
          foreach ($arch in @('x86', 'x64')) {
            $tempDir = Join-Path $env:RUNNER_TEMP "zip-$arch"
            New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
            foreach ($name in $archFiles[$arch]) {
              Copy-Item -LiteralPath (Join-Path 'src/build' $name) -Destination $tempDir -Force
            }
            $zip = "Extensions-$arch-$env:VERSION.zip"
            Compress-Archive -Path (Join-Path $tempDir '*') -DestinationPath $zip -Force
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
              throw "Archive was not created: $zip"
            }
            if ((Get-Item -LiteralPath $zip).Length -le 0) {
              throw "Archive is empty: $zip"
            }
            Remove-Item -LiteralPath $tempDir -Recurse -Force
          }

      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: 'Extensions-x86-${{ steps.version.outputs.ver4 }}.zip,Extensions-x64-${{ steps.version.outputs.ver4 }}.zip,ExplorerExtensionSetup.exe,LICENSE.md'
          bodyFile: doc/release_body.md
          artifactErrorsFailBuild: true
          skipIfReleaseExists: true
          prerelease: ${{ steps.version.outputs.is_prerelease }}

      - name: Cleanup signing key
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP\codesign.pfx" -Force -ErrorAction SilentlyContinue
