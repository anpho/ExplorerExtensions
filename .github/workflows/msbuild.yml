name: MSBuild

on:
  push:
    
  pull_request:
    

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./src

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6.0.1

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build x86
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Build 32-bit version
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Build 64-bit version
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Install Inno Setup and Build
      uses:  callebstrom/inno-setup-cli-action@6.2.1
      with:
        file: Installer.iss

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: WindowsExplorerExtensions_Installer
        path: |
          ./Output/ExplorerExtensionSetup.exe
