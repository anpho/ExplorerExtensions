name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    # Pin the image: windows-latest now points to the VS 2026 image, where the
    # v143 toolset is installed for compatibility without ATL headers, so
    # <atlbase.h> cannot be found. windows-2022 has VS 2022 (v143) with ATL.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build x86
        shell: pwsh
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x86 ./src
          if ($LASTEXITCODE -ne 0) {
            throw "x86 build failed with exit code $LASTEXITCODE."
          }

      - name: Build x64
        shell: pwsh
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 ./src
          if ($LASTEXITCODE -ne 0) {
            throw "x64 build failed with exit code $LASTEXITCODE."
          }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            'src/build/ExplorerEnhancement_x86.dll'
            'src/build/ExplorerEnhancement_x64.dll'
            'src/build/ExplorerEnhancementManager_x86.exe'
            'src/build/ExplorerEnhancementManager_x64.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected build output is missing: $file"
            }
          }

      - name: Smoke test registration
        shell: pwsh
        run: |
          $manager = Join-Path $PWD 'src\build\ExplorerEnhancementManager_x64.exe'
          # /install registers under HKCU for a normal user and under HKLM when the
          # process is elevated (GitHub-hosted runners run elevated), so check both.
          $relativeKeys = @(
            'Software\Classes\CLSID\{c36a65af-0a1e-4e09-9729-6da3e4e4461a}\InprocServer32'
            'Software\Classes\CLSID\{f2a0aaf9-2961-4465-a843-884383fcd13b}\InprocServer32'
            'Software\Classes\*\shellex\ContextMenuHandlers\NewFolderExtension'
            'Software\Classes\Directory\shellex\ContextMenuHandlers\NewFolderExtension'
            'Software\Classes\Directory\shellex\ContextMenuHandlers\BreakFolder'
          )
          $install = Start-Process -FilePath $manager -ArgumentList '/install' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "manager /install failed with exit code $($install.ExitCode)."
          }
          $root = $null
          foreach ($candidate in @('HKLM:', 'HKCU:')) {
            if (Test-Path -LiteralPath "$candidate\$($relativeKeys[0])") {
              $root = $candidate
              break
            }
          }
          if (-not $root) {
            throw 'Registration keys are missing under both HKLM and HKCU after /install.'
          }
          foreach ($relative in $relativeKeys) {
            $key = "$root\$relative"
            if (-not (Test-Path -LiteralPath $key)) {
              throw "Registration key is missing after /install: $key"
            }
          }
          $uninstall = Start-Process -FilePath $manager -ArgumentList '/uninstall' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "manager /uninstall failed with exit code $($uninstall.ExitCode)."
          }
          foreach ($relative in $relativeKeys) {
            $key = "$root\$relative"
            if (Test-Path -LiteralPath $key) {
              throw "Registration key was not removed by /uninstall: $key"
            }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source } else { $makensis = $null }
          }
          if (-not $makensis) {
            throw 'makensis.exe not found: NSIS is missing from the runner image.'
          }
          & $makensis Installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ExplorerExtensions_Installer
          path: ./ExplorerExtensionSetup.exe
          if-no-files-found: error
